<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hôpital Espérance</title>

<style>
/* ============ Variables & thèmes ============ */
:root{
  --color-primary:#0e7c86; --color-primary-dark:#0a5c63; --color-accent:#2fbf9f;
  --color-bg:#f6f9fb; --color-surface:#ffffff; --color-text:#17222b; --color-text-muted:#56676f;
  --color-border:#e2e8ec; --shadow-sm:0 2px 8px rgba(15,40,50,.06); --shadow-md:0 8px 24px rgba(15,40,50,.10);
  --radius:14px; --font:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
}
[data-theme="dark"]{
  --color-primary:#34c9b8; --color-primary-dark:#22a596; --color-accent:#7ee8d4;
  --color-bg:#0e1417; --color-surface:#171f24; --color-text:#eaf2f2; --color-text-muted:#a9b8bd;
  --color-border:#263138; --shadow-sm:0 2px 8px rgba(0,0,0,.35); --shadow-md:0 8px 28px rgba(0,0,0,.45);
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);background:var(--color-bg);color:var(--color-text);transition:background .25s,color .25s;line-height:1.55}
a{color:inherit;text-decoration:none} img{max-width:100%;display:block} button{font-family:inherit;cursor:pointer}
.container{max-width:1160px;margin:0 auto;padding:0 20px}
.hidden{display:none !important}

/* Header */
.site-header{position:sticky;top:0;z-index:100;background:var(--color-surface);border-bottom:1px solid var(--color-border);box-shadow:var(--shadow-sm)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:14px 0;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.2rem;color:var(--color-primary);cursor:pointer;border:none;background:none}
.brand-icon{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--color-primary),var(--color-accent));display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.2rem}
.nav-links{display:flex;gap:6px;align-items:center;list-style:none;margin:0;padding:0}
.nav-links a{padding:9px 14px;border-radius:9px;font-weight:600;font-size:.95rem;color:var(--color-text-muted);transition:background .15s,color .15s;cursor:pointer}
.nav-links a:hover,.nav-links a.active{background:rgba(14,124,134,.1);color:var(--color-primary)}
[data-theme="dark"] .nav-links a:hover,[data-theme="dark"] .nav-links a.active{background:rgba(52,201,184,.14)}
.nav-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);display:flex;align-items:center;justify-content:center;font-size:1.05rem;transition:transform .15s,background .15s}
.icon-btn:hover{transform:translateY(-2px);background:var(--color-bg)}
.lang-select{border:1px solid var(--color-border);border-radius:9px;background:var(--color-surface);color:var(--color-text);padding:8px 10px;font-weight:600;font-size:.85rem}
.btn-admin-nav{background:var(--color-primary);color:#fff !important;padding:9px 16px !important;border-radius:9px}
.burger{display:none;width:38px;height:38px;border-radius:9px;border:1px solid var(--color-border);background:var(--color-surface);align-items:center;justify-content:center}

/* Boutons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:10px;font-weight:700;font-size:.95rem;border:none;transition:transform .15s,box-shadow .15s,background .15s}
.btn-primary{background:linear-gradient(135deg,var(--color-primary),var(--color-primary-dark));color:#fff;box-shadow:var(--shadow-sm)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.btn-outline{background:transparent;border:2px solid rgba(255,255,255,.7);color:#fff}
.btn-outline:hover{background:rgba(255,255,255,.15)}
.btn-secondary{background:var(--color-surface);border:1px solid var(--color-border);color:var(--color-text)}
.btn-secondary:hover{background:var(--color-bg)}
.btn-danger{background:#d64545;color:#fff}
.btn-sm{padding:7px 12px;font-size:.82rem;border-radius:8px}
.btn-block{width:100%;justify-content:center}

/* Hero */
.hero{position:relative;min-height:78vh;display:flex;align-items:center;color:#fff;
  background:linear-gradient(120deg,rgba(10,40,45,.82),rgba(10,60,66,.55)),
  url('https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?auto=format&fit=crop&w=1740&q=80') center/cover no-repeat fixed}
.hero-content{max-width:640px;padding:90px 0}
.hero-content h1{font-size:clamp(2rem,4.5vw,3.1rem);margin:0 0 16px;font-weight:800}
.hero-content p{font-size:1.15rem;opacity:.92;margin:0 0 30px}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap}

/* Sections */
.section{padding:70px 0}
.section-title{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:800;margin:0 0 8px;text-align:center}
.section-subtitle{text-align:center;color:var(--color-text-muted);max-width:620px;margin:0 auto 42px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:26px}
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
.card-media{height:170px;background:linear-gradient(135deg,var(--color-primary),var(--color-accent));display:flex;align-items:center;justify-content:center;color:#fff;font-size:2.4rem;overflow:hidden}
.card-media img{width:100%;height:100%;object-fit:cover}
.card-body{padding:22px;display:flex;flex-direction:column;gap:10px;flex:1}
.card-body h3{margin:0;font-size:1.15rem}
.card-body p{margin:0;color:var(--color-text-muted);font-size:.93rem;flex:1}
.card-meta{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--color-text-muted);border-top:1px solid var(--color-border);padding-top:12px;margin-top:4px}
.why-icon{width:56px;height:56px;border-radius:14px;background:rgba(14,124,134,.1);color:var(--color-primary);display:flex;align-items:center;justify-content:center;font-size:1.5rem;margin-bottom:16px}
[data-theme="dark"] .why-icon{background:rgba(52,201,184,.14)}

/* Formulaires */
.form-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius);padding:34px;box-shadow:var(--shadow-sm);max-width:720px;margin:0 auto}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.form-group.full{grid-column:1 / -1}
label{font-weight:600;font-size:.88rem}
input,select,textarea{padding:11px 13px;border-radius:9px;border:1px solid var(--color-border);background:var(--color-bg);color:var(--color-text);font-family:inherit;font-size:.95rem}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--color-primary);box-shadow:0 0 0 3px rgba(14,124,134,.15)}
textarea{resize:vertical;min-height:110px}
.alert{padding:14px 18px;border-radius:10px;margin-bottom:20px;font-weight:600;font-size:.92rem}
.alert-success{background:rgba(47,191,159,.15);color:#0a8f6f}
.alert-error{background:rgba(214,69,69,.12);color:#d64545}
[data-theme="dark"] .alert-success{color:#7ee8d4}

/* Footer */
.site-footer{background:#0d2226;color:#cfe3e2;padding:54px 0 24px;margin-top:40px}
[data-theme="dark"] .site-footer{background:#0a0f12}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:30px;margin-bottom:30px}
.footer-grid h4{color:#fff;margin:0 0 14px}
.footer-grid p,.footer-grid a{color:#9fb8b6;font-size:.9rem}
.footer-bottom{border-top:1px solid rgba(255,255,255,.08);padding-top:18px;text-align:center;font-size:.82rem;color:#7f9997}

/* Admin */
.admin-shell{display:flex;min-height:calc(100vh - 66px)}
.admin-sidebar{width:230px;background:var(--color-surface);border-right:1px solid var(--color-border);padding:24px 14px;flex-shrink:0}
.admin-sidebar a{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:9px;font-weight:600;color:var(--color-text-muted);margin-bottom:4px;font-size:.92rem;cursor:pointer}
.admin-sidebar a:hover,.admin-sidebar a.active{background:rgba(14,124,134,.1);color:var(--color-primary)}
.admin-main{flex:1;padding:30px}
.admin-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px;flex-wrap:wrap;gap:12px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:30px}
.stat-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow-sm)}
.stat-card .num{font-size:1.8rem;font-weight:800;color:var(--color-primary)}
.stat-card .label{color:var(--color-text-muted);font-size:.85rem}
.table-wrap{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius);overflow:auto;box-shadow:var(--shadow-sm)}
table{width:100%;border-collapse:collapse}
th,td{padding:13px 16px;text-align:left;font-size:.9rem;border-bottom:1px solid var(--color-border);white-space:nowrap}
th{background:var(--color-bg);font-weight:700;color:var(--color-text-muted);text-transform:uppercase;font-size:.74rem;letter-spacing:.04em}
tr:last-child td{border-bottom:none}
.badge{padding:4px 10px;border-radius:20px;font-size:.74rem;font-weight:700}
.badge-ok{background:rgba(47,191,159,.15);color:#0a8f6f}
.badge-cancel{background:rgba(214,69,69,.12);color:#d64545}
.thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--color-bg)}
.admin-login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--color-primary-dark),var(--color-primary));padding:20px}
.admin-login-card{background:var(--color-surface);padding:40px;border-radius:var(--radius);width:100%;max-width:400px;box-shadow:var(--shadow-md)}
.actions-row{display:flex;gap:8px;flex-wrap:wrap}
.checkbox-row{display:flex;align-items:center;gap:8px}
.checkbox-row input{width:auto}

@media (max-width:920px){
  .grid-3,.grid-2{grid-template-columns:1fr}
  .footer-grid{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:1fr}
  .admin-sidebar{display:none}
}
@media (max-width:760px){
  .nav-links{display:none}
  .burger{display:flex}
  .nav-links.open{display:flex;flex-direction:column;position:absolute;top:66px;left:0;right:0;background:var(--color-surface);padding:12px;border-bottom:1px solid var(--color-border);z-index:99}
  .hero{min-height:92vh;text-align:center}
  .hero-content{margin:0 auto}
  .hero-actions{justify-content:center}
}
</style>

function t(key){ return (TRANSLATIONS[state.lang] && TRANSLATIONS[state.lang][key]) || key; }

async function api(path, opts={}){
  const res = await fetch(API + path, { credentials:"same-origin", ...opts });
  let data = null;
  try { data = await res.json(); } catch(e){}
  if(!res.ok) throw Object.assign(new Error("api_error"), {status:res.status, data});
  return data;
}

/* ---------- Thème ---------- */
function initTheme(){
  const saved = localStorage.getItem("hopital-theme");
  if(saved) document.documentElement.setAttribute("data-theme", saved);
  else if(window.matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.setAttribute("data-theme","dark");
  updateThemeIcon();
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute("data-theme")==="dark" ? "dark":"light";
  const next = cur==="dark" ? "light":"dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("hopital-theme", next);
  updateThemeIcon();
}
function updateThemeIcon(){
  document.getElementById("theme-toggle").textContent =
    document.documentElement.getAttribute("data-theme")==="dark" ? "☀️" : "🌙";
}

/* ---------- Router ---------- */
async function router(){
  const hash = location.hash || "#/";
  document.querySelectorAll(".nav-links a").forEach(a=>{
    a.classList.toggle("active", a.getAttribute("data-route")===hash);
  });
  document.getElementById("nav-links").classList.remove("open");
  const app = document.getElementById("app");

  if(hash === "#/") app.innerHTML = await pageHome();
  else if(hash === "#/consultation") app.innerHTML = await pageConsultation();
  else if(hash === "#/rendez-vous") app.innerHTML = await pageAppointment();
  else if(hash === "#/contact") app.innerHTML = pageContact();
  else if(hash.startsWith("#/espace-78eea76987")) await renderAdmin(hash);
  else app.innerHTML = await pageHome();

  bindPageEvents(hash);
  window.scrollTo(0,0);
}

      const alertBox = document.getElementById("appointment-alert");

  if(contactForm){

      e.preventDefault();
      const fd = new FormData(contactForm);
      const payload = Object.fromEntries(fd.entries());

      }
    });
  }
}

/* =====================================================================
   ESPACE ADMIN
   Le mot de passe est envoyé une seule fois, en HTTPS, au serveur qui le
   compare à un hash stocké en base (jamais accessible depuis ce fichier).
===================================================================== */
async function renderAdmin(hash){
  const app = document.getElementById("app");
  try{
    const s = await api("/api/admin/session");
    state.authenticated = s.authenticated;
    state.username = s.username;
  }catch(e){ state.authenticated = false; }

  if(!state.authenticated){
    app.innerHTML = adminLoginView();
    document.getElementById("admin-login-form").addEventListener("submit", async e=>{
      e.preventDefault();
      const fd = new FormData(e.target);
      const payload = Object.fromEntries(fd.entries());
      const errBox = document.getElementById("admin-login-error");
      try{
        await api("/api/admin/login", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)});
        location.hash = "#/espace-78eea76987/dashboard";
        router();
      }catch(err){
        const msg = err.status === 429 ? t('admin_login_locked') : t('admin_login_error');
        errBox.innerHTML = `<div class="alert alert-error">${msg}</div>`;
      }
    });
    return;
  }

  const sub = hash.split("?")[0];
  app.innerHTML = adminShell(sub);
  bindAdminSidebar();

  if(sub === "#/espace-78eea76987" || sub === "#/espace-78eea76987/dashboard") await loadAdminDashboard();
  else if(sub === "#/espace-78eea76987/services") await loadAdminServices();
  else if(sub.startsWith("#/espace-78eea76987/services/new")) loadAdminServiceForm(null);
  else if(sub.startsWith("#/espace-78eea76987/services/edit")) {
    const id = new URLSearchParams(hash.split("?")[1]).get("id");
    await loadAdminServiceForm(id);
  }
  else if(sub === "#/espace-78eea76987/appointments") await loadAdminAppointments();
  else if(sub === "#/espace-78eea76987/messages") await loadAdminMessages();
  else await loadAdminDashboard();
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

  }));
}

/* ---------- Initialisation globale ---------- */
document.addEventListener("DOMContentLoaded", ()=>{
  initTheme();
  applyStaticI18n();

  document.getElementById("theme-toggle").addEventListener("click", toggleTheme);
  document.getElementById("burger").addEventListener("click", ()=>document.getElementById("nav-links").classList.toggle("open"));
  document.getElementById("lang-select").addEventListener("change", e=>{
    state.lang = e.target.value;
    localStorage.setItem("hopital-lang", state.lang);
    applyStaticI18n();
    router();
  });
  document.querySelectorAll("[data-route]").forEach(el=>{
    el.addEventListener("click", ()=>{ location.hash = el.getAttribute("data-route"); });
  });

  window.addEventListener("hashchange", router);
  router();
});
</script>
</body>
</html>
